[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "alpharadar"
version = "0.1.0"
description = "主线雷达 — 自上而下、市场状态感知的 A 股主题投资研究系统"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Mainline Alpha Radar" }]

# 运行时依赖见 requirements.txt；此处保留核心最小集合
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
data = ["akshare>=1.12.0", "pyarrow>=14.0.0", "duckdb>=0.9.0", "SQLAlchemy>=2.0.0"]
mining = ["scikit-learn>=1.3.0", "scipy>=1.10.0"]
report = ["jinja2>=3.1.0", "matplotlib>=3.7.0"]
dev = ["pytest>=7.4.0"]

[project.scripts]
alpharadar = "alpharadar.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
